[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bahnwatch"
version = "0.1.0"
description = "Commute alerting for Berlin transit: when to leave, not just what is late"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "fastapi>=0.110",
    # [standard] pulls in the websockets library. Bare uvicorn has no WebSocket
    # support, so /ws returns 404 and the client sits in a reconnect loop while
    # the page looks almost fine -- the core transport silently not working.
    "uvicorn[standard]>=0.27",
    # Windows ships no system timezone database, so ZoneInfo("Europe/Berlin")
    # raises at import. Linux and macOS have one, which is exactly why this is
    # easy to miss until someone else installs the project.
    'tzdata; sys_platform == "win32"',
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=4.1", "ruff>=0.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
